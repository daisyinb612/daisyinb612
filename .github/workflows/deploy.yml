name: Deploy Academic Homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -R assets _site/assets
          cp -R src _site/src

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: ${{ env.PAGES_ENABLEMENT_TOKEN != '' }}
          token: ${{ env.PAGES_ENABLEMENT_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
