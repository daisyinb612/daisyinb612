  <head>

    />

    <meta name="theme-color" content="#ffffff" />
    <title>Xuejiao Ma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f6f7fb;
        color: #17202a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      [data-language="en"],
      [data-language="en"] * {
        font-family: "Nunito", sans-serif;
      }

      [data-stage-heading="true"] {
        color: #008c97 !important;
        font-family: "Bowlby One", "Nunito", sans-serif !important;
        font-weight: 400 !important;
        letter-spacing: 0.02em !important;
        text-transform: uppercase;
      }

      ::selection {
        background: #4ae9d9;
        color: #073b38;
      }

      *:focus-visible {
        outline: 3px solid #4ae9d9;
        outline-offset: 3px;
      }

      [data-featured-overlay="true"] {
        background: linear-gradient(
          180deg,
          rgba(0, 140, 151, 0.18) 0%,
          rgba(0, 140, 151, 0.52) 42%,
          rgba(0, 140, 151, 0.9) 78%,
          rgba(0, 140, 151, 0.96) 100%
        );
        transition: background 220ms ease;
      }

      [data-featured-overlay="true"][data-interactive-state="active"],
      [data-featured-card="true"]:hover [data-featured-overlay="true"],
      [data-featured-card="true"]:focus [data-featured-overlay="true"],
      [data-featured-card="true"]:focus-visible [data-featured-overlay="true"] {
        align-items: center;
        background: rgba(0, 140, 151, 0.96);
        justify-content: center;
      }

      [data-featured-card="true"]:hover [data-featured-full-title="true"],
      [data-featured-card="true"]:focus [data-featured-full-title="true"],
      [data-featured-card="true"]:focus-visible [data-featured-full-title="true"] {
        display: none;
      }

      [data-featured-card="true"]:hover [data-featured-overlay="true"] > :first-child,
      [data-featured-card="true"]:focus [data-featured-overlay="true"] > :first-child,
      [data-featured-card="true"]:focus-visible [data-featured-overlay="true"] > :first-child {
        text-align: center;
      }

      [data-featured-card="true"] {
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      [data-featured-card="true"][data-interactive-state="active"],
      [data-featured-card="true"]:hover,
      [data-featured-card="true"]:focus,
      [data-featured-card="true"]:focus-visible {
        box-shadow: 0 10px 24px rgba(0, 140, 151, 0.24);
        transform: translateY(-2px);
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
    <script type="importmap">

      }
